# Jeu d'évaluation de l'agent text-to-SQL.
# Les résultats attendus ne sont PAS ici : ils sont figés dans eval/expected_results.json
# (générés en exécutant reference_sql sur BigQuery).

# ---------- Catégorie : simple (une table, un filtre) ----------

- id: q001
  split: test
  category: simple
  question: "Quelle a été l'anomalie moyenne de température maximale en Occitanie en 2022, en °C ?"
  reference_sql: |
    SELECT mean_tmax_anomaly_c
    FROM marts.mart_occitanie_yearly
    WHERE observation_year = 2022
  notes: "Réponse attendue : 2.21 °C."

- id: q002
  split: dev
  category: simple
  question: "En 2022, combien de jours à 30 °C ou plus une station d'Occitanie a-t-elle connus en moyenne ?"
  reference_sql: |
    SELECT mean_heat_days_per_station
    FROM marts.mart_occitanie_yearly
    WHERE observation_year = 2022
  notes: "Moyenne par station du réseau fixe."

- id: q003
