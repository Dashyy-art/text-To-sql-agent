# ---------- Catégorie : aggregation (GROUP BY, AVG, SUM, classements) ----------

- id: q011
  split: test
  category: aggregation
  question: "Quels sont les 3 départements avec le plus de jours à 35 °C ou plus par station en 2019, du premier au troisième ?"
  reference_sql: |
    SELECT department_name, mean_very_hot_days_per_station
    FROM marts.mart_department_yearly
    WHERE observation_year = 2019
    ORDER BY mean_very_hot_days_per_station DESC
    LIMIT 3
  order_matters: true
  notes: "Attendu : Gard, Aude, Lot (Haute-Garonne 4e à 11.0, juste derrière le Lot à 11.3)."

- id: q012
  split: dev
  category: aggregation
  question: "Quelles sont les 3 années, entre 1991 et 2025, où une station d'Occitanie a connu en moyenne le plus de jours à 30 °C ou plus, de la première à la troisième ?"
  reference_sql: |
    SELECT observation_year, mean_heat_days_per_station
    FROM marts.mart_occitanie_yearly
    ORDER BY mean_heat_days_per_station DESC
    LIMIT 3
  order_matters: true
  notes: "Attendu : 2022, 2003, 2025."

- id: q013
  split: test
  category: aggregation
  question: "Sur 1991-2025, combien de jours à 30 °C ou plus une station d'Occitanie connaît-elle en moyenne par an ? Arrondir à 1 décimale."
  reference_sql: |
    SELECT ROUND(AVG(mean_heat_days_per_station), 1) AS avg_heat_days
    FROM marts.mart_occitanie_yearly
  notes: "Moyenne des 35 moyennes annuelles."

- id: q014
  split: test
  category: aggregation
  question: "Quel département compte le plus d'épisodes de vague de chaleur, toutes années confondues ?"
  reference_sql: |
    SELECT department_code, COUNT(*) AS heatwave_count
    FROM marts.mart_heatwaves
    GROUP BY department_code
    ORDER BY heatwave_count DESC
    LIMIT 1
  notes: "Attendu : le Gard (30). mart_heatwaves n'a que le code : la comparaison doit accepter le nom 'Gard' ou le code '30'."

- id: q015
  split: test
  category: aggregation
  question: "Quelle station a enregistré la température la plus élevée pendant une vague de chaleur, et quelle était cette température ?"
  reference_sql: |
    SELECT station_name, peak_tmax_c
    FROM marts.mart_heatwaves
    ORDER BY peak_tmax_c DESC
    LIMIT 1
  notes: "Attendu : VERARGUES, 46.0 °C (juin 2019, record national). L'agent peut ajouter la date."

- id: q016
  split: test
  category: aggregation
  question: "Quelle est la durée moyenne d'une vague de chaleur, en jours, arrondie à 1 décimale ?"
  reference_sql: |
    SELECT ROUND(AVG(duration_days), 1) AS avg_duration_days
    FROM marts.mart_heatwaves
  notes: "Toutes stations et toutes années."

- id: q017
  split: test
  category: aggregation
  question: "Quel a été le cumul annuel de précipitations à la station de Carcassonne (11069001) en 2018, en mm ?"
  reference_sql: |
    SELECT ROUND(SUM(total_precip_mm), 1) AS total_precip_mm
    FROM marts.mart_station_monthly
    WHERE station_id = '11069001' AND observation_year = 2018
  notes: "Somme des 12 cumuls mensuels (12 mois présents)."

- id: q018
  split: test
  category: aggregation
  question: "En 2022, combien de départements d'Occitanie avaient une anomalie moyenne de température maximale supérieure à 2 °C ?"
  reference_sql: |
    SELECT COUNT(*) AS department_count
    FROM marts.mart_department_yearly
    WHERE observation_year = 2022 AND mean_tmax_anomaly_c > 2
  notes: "Attendu : 11 sur 13."

- id: q019
  split: dev
  category: aggregation
  question: "Quels sont les 3 départements avec la plus forte anomalie moyenne de température maximale sur 2016-2025, du premier au troisième ?"
  reference_sql: |
    SELECT department_name, ROUND(AVG(mean_tmax_anomaly_c), 2) AS avg_anomaly_c
    FROM marts.mart_department_yearly
    WHERE observation_year BETWEEN 2016 AND 2025
    GROUP BY department_name
    ORDER BY avg_anomaly_c DESC
    LIMIT 3
  order_matters: true
  notes: "Attendu : Aude, Lozère, Hautes-Pyrénées. Le Gers (4e) n'est qu'à 0.01 °C derrière : cas limite."

- id: q020
  split: test
  category: aggregation
  question: "À la station de Toulouse-Blagnac (31069001), quel mois est le plus pluvieux en moyenne sur la période 1991-2020 ?"
  reference_sql: |
    SELECT observation_month, ROUND(AVG(total_precip_mm), 1) AS avg_precip_mm
    FROM marts.mart_station_monthly
    WHERE station_id = '31069001' AND observation_year BETWEEN 1991 AND 2020
    GROUP BY observation_month
    ORDER BY avg_precip_mm DESC
    LIMIT 1
  notes: "Attendu : mai (mois 5), 73.6 mm. L'agent peut répondre 'mai' ou '5'."


# ---------- Catégorie : temporal (périodes, tendances, évolutions) ----------

- id: q021
  split: test
  category: temporal
  question: "Quelle a été l'année la plus chaude par rapport à la normale 1991-2020 en Occitanie, et quelle était son anomalie en °C ?"
  reference_sql: |
    SELECT observation_year, mean_tmax_anomaly_c
    FROM marts.mart_occitanie_yearly
    ORDER BY mean_tmax_anomaly_c DESC
    LIMIT 1
  notes: "Attendu : 2022, +2.21 °C."

- id: q022
  split: test
  category: temporal
  question: "Depuis quelle année toutes les années ont-elles dépassé la normale 1991-2020 en Occitanie ?"
  reference_sql: |
    SELECT MAX(observation_year) + 1 AS first_year_of_streak
    FROM marts.mart_occitanie_yearly
    WHERE mean_tmax_anomaly_c <= 0
  notes: "Attendu : 2014 (README de prj_data : 12 années de 2014 à 2025). Astuce : dernière année sous la normale, plus un."

- id: q023
  split: test
  category: temporal
  question: "Quelle est la tendance de la température maximale en Occitanie, en °C par décennie, estimée par régression linéaire sur l'anomalie régionale de 1991 à 2025 ? Arrondir à 2 décimales."
  reference_sql: |
    SELECT ROUND(10 * COVAR_POP(mean_tmax_anomaly_c, observation_year)
                 / VAR_POP(observation_year), 2) AS trend_c_per_decade
    FROM marts.mart_occitanie_yearly
  notes: "Attendu : +0.59 °C/décennie (README). Pente = covariance / variance, multipliée par 10 pour passer de l'année à la décennie."

- id: q024
  split: dev
  category: temporal
  question: "Combien de jours à 30 °C ou plus une station d'Occitanie connaissait-elle en moyenne par an sur 1991-2000, et combien sur 2016-2025 ? Arrondir à 1 décimale."
  reference_sql: |
    SELECT
      IF(observation_year <= 2000, '1991-2000', '2016-2025') AS period,
      ROUND(AVG(mean_heat_days_per_station), 1) AS avg_heat_days
    FROM marts.mart_occitanie_yearly
    WHERE observation_year BETWEEN 1991 AND 2000
       OR observation_year BETWEEN 2016 AND 2025
    GROUP BY period
  notes: "Attendu : 27.5 puis 45.9 (README). Deux lignes ; l'ordre n'a pas d'importance."

- id: q025
  split: test
  category: temporal
  question: "De combien de jours le nombre moyen de jours à 35 °C ou plus par station a-t-il augmenté entre 1991-2000 et 2016-2025 en Occitanie ? Arrondir à 1 décimale."
  reference_sql: |
    SELECT ROUND(
      AVG(IF(observation_year BETWEEN 2016 AND 2025, mean_very_hot_days_per_station, NULL))
      - AVG(IF(observation_year BETWEEN 1991 AND 2000, mean_very_hot_days_per_station, NULL)),
      1) AS increase_days
    FROM marts.mart_occitanie_yearly
  notes: "Attendu : 7.1 (de 2.6 à 9.7, README)."

- id: q026
  split: test
  category: temporal
  question: "Pour les stations du réseau fixe, combien d'épisodes de vague de chaleur ont commencé entre 1991 et 2000, et combien entre 2016 et 2025 ?"
  reference_sql: |
    SELECT
      IF(start_year <= 2000, '1991-2000', '2016-2025') AS period,
      COUNT(*) AS heatwave_count
    FROM marts.mart_heatwaves
    WHERE is_trend_station
      AND (start_year BETWEEN 1991 AND 2000 OR start_year BETWEEN 2016 AND 2025)
    GROUP BY period
  notes: "Attendu : 143 puis 752 (README). Piège : oublier le filtre is_trend_station."

- id: q027
  split: test
  category: temporal
  question: "Entre 1991 et 2025, combien d'années ont été plus chaudes que la normale 1991-2020 en Occitanie ?"
  reference_sql: |
    SELECT COUNTIF(mean_tmax_anomaly_c > 0) AS years_above_normal
    FROM marts.mart_occitanie_yearly
  notes: "Attendu : 19 sur 35."

- id: q028
  split: dev
  category: temporal
  question: "Quelle a été l'année la plus froide par rapport à la normale 1991-2020 en Occitanie ?"
  reference_sql: |
    SELECT observation_year, mean_tmax_anomaly_c
    FROM marts.mart_occitanie_yearly
    ORDER BY mean_tmax_anomaly_c ASC
    LIMIT 1
  notes: "Attendu : 1996 (-1.18 °C)."

- id: q029
  split: test
  category: temporal
  question: "Quelle année a connu la plus forte hausse de l'anomalie régionale par rapport à l'année précédente, et de combien de °C ?"
  reference_sql: |
    SELECT
      observation_year,
      ROUND(mean_tmax_anomaly_c
            - LAG(mean_tmax_anomaly_c) OVER (ORDER BY observation_year), 2) AS increase_c
    FROM marts.mart_occitanie_yearly
    QUALIFY increase_c IS NOT NULL
    ORDER BY increase_c DESC
    LIMIT 1
  notes: "Attendu : 2022 (+2.12 °C par rapport à 2021). Nécessite une fonction de fenêtre (LAG)."

- id: q030
  split: test
  category: temporal
  question: "Parmi les décennies complètes de 1950-1959 à 2010-2019, laquelle compte le plus d'épisodes de vague de chaleur pour les stations du réseau fixe ?"
  reference_sql: |
    SELECT DIV(start_year, 10) * 10 AS decade_start, COUNT(*) AS heatwave_count
    FROM marts.mart_heatwaves
    WHERE is_trend_station AND start_year BETWEEN 1950 AND 2019
    GROUP BY decade_start
    ORDER BY heatwave_count DESC
    LIMIT 1
  notes: "Attendu : les années 2000 (403 épisodes, devant 2010-2019 avec 353). Résultat contre-intuitif : bon test."


# ---------- Catégorie : multi_table (jointures, logique métier) ----------

- id: q031
  split: test
  category: multi_table
  question: "Quelle station a connu la vague de chaleur la plus longue, combien de jours a-t-elle duré, et dans quel département se trouve cette station ?"
  reference_sql: |
    SELECT h.station_name, d.department_name, h.duration_days
    FROM marts.mart_heatwaves AS h
    JOIN (
      SELECT DISTINCT department_code, department_name
      FROM marts.mart_department_yearly
    ) AS d USING (department_code)
    ORDER BY h.duration_days DESC
    LIMIT 1
  notes: "Attendu : GENERARGUES, Gard, 22 jours (juin 1952). Le nom du département n'est que dans mart_department_yearly."

- id: q032
  split: test
  category: multi_table
  question: "En 2022, quelle station a connu le plus de jours à 30 °C ou plus, en ne gardant que les années complètes ? Donne son nom et le nombre de jours."
  reference_sql: |
    SELECT names.station_name, y.heat_days
    FROM marts.mart_station_yearly AS y
    JOIN (
      SELECT DISTINCT station_id, station_name
      FROM marts.mart_heatwaves
    ) AS names USING (station_id)
    WHERE y.observation_year = 2022 AND y.is_complete_year
    ORDER BY y.heat_days DESC
    LIMIT 1
  notes: "Attendu : CERET (66049001), 100 jours. Le nom vient de mart_heatwaves ; filtre is_complete_year obligatoire."

- id: q033
  split: dev
  category: multi_table
  question: "En 2022, quels départements ont eu une anomalie de température maximale supérieure à celle de l'Occitanie dans son ensemble ?"
  reference_sql: |
    SELECT d.department_name
    FROM marts.mart_department_yearly AS d
    JOIN marts.mart_occitanie_yearly AS o USING (observation_year)
    WHERE d.observation_year = 2022
      AND d.mean_tmax_anomaly_c > o.mean_tmax_anomaly_c
  notes: "Attendu : 6 départements (Gers, Haute-Garonne, Hautes-Pyrénées, Lozère, Tarn, Tarn-et-Garonne). Régional : 2.21 °C."

- id: q034
  split: test
  category: multi_table
  question: "Combien d'épisodes de vague de chaleur, comptés station par station, ont commencé dans l'Hérault en 2019 ?"
  reference_sql: |
    SELECT COUNT(*) AS heatwave_count
    FROM marts.mart_heatwaves AS h
    JOIN (
      SELECT DISTINCT department_code, department_name
      FROM marts.mart_department_yearly
    ) AS d USING (department_code)
    WHERE d.department_name = 'Hérault' AND h.start_year = 2019
  notes: "Attendu : 58. L'agent peut aussi filtrer directement department_code = '34' sans jointure : c'est juste aussi."

- id: q035
  split: test
  category: multi_table
  question: "Combien de jours à 30 °C ou plus la station de Perpignan a-t-elle connus en 2022 ?"
  reference_sql: |
    SELECT y.heat_days
    FROM marts.mart_station_yearly AS y
    WHERE y.observation_year = 2022
      AND y.station_id IN (
        SELECT station_id FROM marts.mart_heatwaves WHERE station_name = 'PERPIGNAN'
      )
  notes: "Attendu : 76. Contrairement à q008/q010, l'identifiant n'est PAS donné : il faut le retrouver par le nom (unique ici)."

- id: q036
  split: test
  category: multi_table
  question: "Pour les stations du réseau fixe, quelle année compte le plus d'épisodes de vague de chaleur, et quelle a été l'anomalie régionale cette année-là ?"
  reference_sql: |
    SELECT h.start_year, COUNT(*) AS heatwave_count, ANY_VALUE(o.mean_tmax_anomaly_c) AS anomaly_c
    FROM marts.mart_heatwaves AS h
    JOIN marts.mart_occitanie_yearly AS o ON o.observation_year = h.start_year
    WHERE h.is_trend_station
    GROUP BY h.start_year
    ORDER BY heatwave_count DESC
    LIMIT 1
  notes: "Attendu : 2022, 176 épisodes, +2.21 °C."

- id: q037
  split: test
  category: multi_table
  question: "En 2003, quels sont les 3 départements dont l'anomalie a le plus dépassé l'anomalie régionale, du premier au troisième, et de combien de °C ?"
  reference_sql: |
    SELECT d.department_name,
           ROUND(d.mean_tmax_anomaly_c - o.mean_tmax_anomaly_c, 2) AS gap_c
    FROM marts.mart_department_yearly AS d
    JOIN marts.mart_occitanie_yearly AS o USING (observation_year)
    WHERE d.observation_year = 2003
    ORDER BY gap_c DESC
    LIMIT 3
  order_matters: true
  notes: "Attendu : Haute-Garonne (+0.45), Tarn (+0.41), Tarn-et-Garonne (+0.34)."

- id: q038
  split: dev
  category: multi_table
  question: "Combien de stations différentes du Gard ont connu au moins une vague de chaleur commençant en 2019 ?"
  reference_sql: |
    SELECT COUNT(DISTINCT station_id) AS station_count
    FROM marts.mart_heatwaves
    WHERE department_code = '30' AND start_year = 2019
  notes: "Attendu : 35. Piège : COUNT(*) compte les épisodes, pas les stations ; il faut COUNT(DISTINCT)."

- id: q039
  split: test
  category: multi_table
  question: "En 2019, quel mois a eu la température maximale moyenne la plus élevée à la station de Montpellier-Aéroport ?"
  reference_sql: |
    SELECT m.observation_month, m.mean_tmax_c
    FROM marts.mart_station_monthly AS m
    WHERE m.observation_year = 2019
      AND m.station_id IN (
        SELECT station_id FROM marts.mart_heatwaves WHERE station_name = 'MONTPELLIER-AEROPORT'
      )
    ORDER BY m.mean_tmax_c DESC
    LIMIT 1
  notes: "Attendu : juillet (7), 31.71 °C. Identifiant à retrouver par le nom."

- id: q040
  split: test
  category: multi_table
  question: "Quelle station a connu le plus d'épisodes de vague de chaleur, toutes années confondues, et combien de jours à 30 °C ou plus y compte-t-on en moyenne par an sur 1991-2020, en ne gardant que les années complètes ?"
  reference_sql: |
    WITH top_station AS (
      SELECT station_id, ANY_VALUE(station_name) AS station_name, COUNT(*) AS heatwave_count
      FROM marts.mart_heatwaves
      GROUP BY station_id
      ORDER BY heatwave_count DESC
      LIMIT 1
    )
    SELECT t.station_name, t.heatwave_count, ROUND(AVG(y.heat_days), 1) AS avg_heat_days
    FROM top_station AS t
    JOIN marts.mart_station_yearly AS y USING (station_id)
    WHERE y.observation_year BETWEEN 1991 AND 2020 AND y.is_complete_year
    GROUP BY t.station_name, t.heatwave_count
  notes: "Attendu : ST CHRISTOL-LES-ALES, 126 épisodes, 71.2 jours/an (30 années complètes). Question en deux temps."


