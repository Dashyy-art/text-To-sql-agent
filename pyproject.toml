[project]
name = "climate-sql-agent"
version = "0.1.0"
description = "Agent text-to-SQL évalué et sécurisé sur une base DuckDB climatique, exposé via MCP"
readme = "README.md"
authors = [
    { name = "Abdelali Ait Dabachi", email = "dabachicf@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.1",
    "mcp>=2.3,<3",
    "ollama>=0.6.3",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "sqlglot>=30.33.0",
]

[project.scripts]
climate-sql-agent = "climate_sql_agent.agent.cli:main"
climate-sql-mcp = "climate_sql_agent.mcp_server.server:main"
climate-sql-eval = "climate_sql_agent.eval.runner:main"


[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]


[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
